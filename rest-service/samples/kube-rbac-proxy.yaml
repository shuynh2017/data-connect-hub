authorization:
  endpoints:
    - path: /api/v1/connections/*
      mappings:
        - methods: [patch, delete]
          resources:
            - rewrites:
                byHttpHeader:
                  name: X-Tenant-Id
              resourceAttributes:
                namespace: "{{.FromHeader}}"
                apiGroup: dataconnecthub.opendatahub.io
                resource: data-connections-manage
                verb: {{.FromMethod}}
        - methods: [get]
          resources:
            - rewrites:
                byHttpHeader:
                  name: X-Tenant-Id
              resourceAttributes:
                namespace: "{{.FromHeader}}"
                apiGroup: dataconnecthub.opendatahub.io
                resource: data-connections-read
                verb: {{.FromMethod}}
    - path: /api/v1/connections
      mappings:
        - methods: [post]
          resources:
            - rewrites:
                byHttpHeader:
                  name: X-Tenant-Id
              resourceAttributes:
                namespace: "{{.FromHeader}}"
                apiGroup: dataconnecthub.opendatahub.io
                resource: data-connection-manage
                verb: {{.FromMethod}}
        - methods: [get]
          resources:
            - rewrites:
                byHttpHeader:
                  name: X-Tenant-Id
              resourceAttributes:
                namespace: "{{.FromHeader}}"
                apiGroup: dataconnecthub.opendatahub.io
                resource: data-connections-read
                verb: {{.FromMethod}}

    - path: /api/v1/connection_types/*
      mappings:
        - methods: [patch, delete]
          resources:
            - rewrites:
                byHttpHeader:
                  name: X-Tenant-Id
              resourceAttributes:
                namespace: "{{.FromHeader}}"
                apiGroup: dataconnecthub.opendatahub.io
                resource: data-connection-types-manage
                verb: {{.FromMethod}}
        - methods: [get]
          resources:
            - rewrites:
                byHttpHeader:
                  name: X-Tenant-Id
              resourceAttributes:
                namespace: "{{.FromHeader}}"
                apiGroup: dataconnecthub.opendatahub.io
                resource: data-connection-types-read
                verb: get
    - path: /api/v1/connection_types
      mappings:
        - methods: [post, patch, delete]
          resources:
            - rewrites:
                byHttpHeader:
                  name: X-Tenant-Id
              resourceAttributes:
                namespace: "{{.FromHeader}}"
                apiGroup: dataconnecthub.opendatahub.io
                resource: data-connection-types-manage
